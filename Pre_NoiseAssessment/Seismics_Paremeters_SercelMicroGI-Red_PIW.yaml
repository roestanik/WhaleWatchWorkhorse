---
#General Parameters
source           : 'SercelMicroGI_SN4199_60bar' #Sound source
group            : 'PCW' #Functional hearing group

#Parameters for the geometric spreading approximation
spreading        : 'ShallowWater' #Spherical,ShallowWater,Elmer,Cylindrical
spreading_dBred  : 14 #Variable for custom geometric spreading function
spreading_wd     : 20 #Water depth for shallow water geometric spreading function and directivity effect calculation (Lloyd's Mirror)
spreading_safety : -6.6 #Safety threshold for shallow water geometric spreading function
watervel         : 1500.0 #Water spreading velocity [m/s]

kraken_count     : 3 #Number of KRAKEN models to read in :> 0 for no models
kraken_model     : ['Clay200Hz','Sand200Hz','Gravel200Hz'] #Name of the models
kraken_depth     : 5 #Depth to consider in the KRAKEN models
kraken_selection : 0 #Which Kraken model to use, if it is used for spreading

#Absorption model
abs_model        : 'Baltic' #Baltic,North,Pacific,Red,Arctic,Custom

#Cummulative SEL calculation parameters
profile_dur      : 2.0 #Profile duration [h]
profile_spd      : 5.0 #Profile speed [kn]
profile_sr       : 3.0 #Profile shot repitition rate [s]